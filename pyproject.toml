[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[project]
name = "agentos-harness"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "opentelemetry-exporter-otlp-proto-http==1.44.0",
    "opentelemetry-sdk==1.44.0",
]

[tool.uv.build-backend]
module-name = "harness"
module-root = ""
